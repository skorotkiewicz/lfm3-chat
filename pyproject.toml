[project]
name = "lfm3-chat"
version = "0.1.0"
description = "Local camera and voice chat with LiquidAI LFM3-Omni-2B"
requires-python = ">=3.12"
dependencies = [
    "accelerate",
    "fastapi",
    "huggingface-hub",
    "librosa",
    "numpy",
    "onnxruntime",
    "pillow",
    "soundfile",
    "torch",
    "torchcodec",
    "torchvision",
    "transformers>=5.20.2",
    "uvicorn",
    "websockets",
]

[project.scripts]
serve = "serve:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "httpx",
    "pytest",
    "ruff",
]

[tool.uv]
package = true

[tool.hatch.build]
dev-mode-dirs = ["src-pytorch", "."]

[tool.hatch.build.targets.wheel]
only-include = ["src-pytorch/serve.py", "src-pytorch/turn_detection.py", "shared"]
sources = ["src-pytorch"]

[tool.hatch.build.targets.sdist]
only-include = ["src-pytorch", "shared", "pyproject.toml", "README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
